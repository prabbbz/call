<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telepon AI Realtime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📞%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#16182b;--mut:#6b7090;--line:#dde0ee;--ok:#16a34a;--bad:#e11d48;--h:250;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#181b30;--ink:#eceefb;--mut:#9aa0c4;--line:#2a2e4d;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 ui-rounded,"Nunito",system-ui,sans-serif}
.app{max-width:960px;margin:auto;padding:16px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.app{grid-template-columns:380px 1fr;align-items:start}.call{position:sticky;top:16px}}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.call{text-align:center;padding:24px 16px}
.av{width:120px;height:120px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:58px;background:linear-gradient(145deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 40) 75% 48%))}
.av.talk{animation:p 1s infinite}.av.listen{box-shadow:0 0 0 9px hsl(142 70% 45%/.3)}
@keyframes p{50%{transform:scale(1.06);box-shadow:0 0 0 18px hsl(var(--h) 80% 60%/0)}}
@media(prefers-reduced-motion:reduce){.av.talk{animation:none}}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:15px}
.sub{color:var(--mut);font-size:13px}.st{min-height:22px;margin-top:6px;color:var(--mut)}
.bt{display:flex;justify-content:center;gap:16px;margin-top:16px}
.b{width:62px;height:62px;border:0;border-radius:50%;font-size:25px;cursor:pointer;background:var(--line);color:var(--ink)}
.b.go{background:var(--ok);color:#fff}.b.end{background:var(--bad);color:#fff}.b.on{background:hsl(var(--h) 75% 55%);color:#fff}.b:disabled{opacity:.5}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid hsl(var(--h) 85% 60%);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px}
.tab.on{background:hsl(var(--h) 75% 55%);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:12px;text-align:left;cursor:pointer;font:inherit}
.c.on{border-color:hsl(var(--ch) 75% 55%);background:hsl(var(--ch) 80% 55%/.12)}
.c .e{font-size:30px}.c b{display:block}.c span{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:hsl(var(--h) 75% 55%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.sm{padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{padding:8px 12px;border-radius:16px;max-width:88%;font-size:14px}
.m.u{align-self:flex-end;background:hsl(var(--h) 75% 55%);color:#fff}.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.col{display:grid;gap:14px}
</style>
</head>
<body>
<div class="app">
  <section class="box call">
    <div class="av" id="av">🙂</div>
    <h1 id="nm"></h1><div class="sub" id="bl"></div>
    <div class="st" id="st">Siap menelepon</div><div class="sub" id="tm">00:00</div>
    <div class="bt">
      <button class="b" id="mute" title="Bisukan mikrofon" aria-label="Bisukan mikrofon">🎙️</button>
      <button class="b go" id="call" title="Telepon" aria-label="Telepon">📞</button>
      <button class="b" id="stop" title="Potong suara AI" aria-label="Potong suara AI">⏹️</button>
    </div>
    <div class="sub" style="margin-top:12px">Bicara kapan saja untuk menyela AI, seperti telepon sungguhan.</div>
    <div class="row"><input type="text" id="txt" placeholder="Atau ketik pesan..."><button class="sm" id="send" style="flex:0 0 72px">Kirim</button></div>
    <div class="sub" id="warn" style="margin-top:10px"></div>
  </section>

  <div class="col">
    <section class="box">
      <h2>Pilih karakter</h2>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="chars"></div>
    </section>

    <section class="box">
      <h2>Suara dan cara bicara</h2>
      <div class="two">
        <div><label for="voice">Model suara</label><select id="voice"></select></div>
        <div><label for="style">Gaya bicara</label><select id="style">
          <option value="santai">Santai</option><option value="formal">Formal</option><option value="gaul">Gaul</option><option value="lucu">Lucu</option></select></div>
        <div><label for="len">Panjang jawaban</label><select id="len"><option value="singkat">Singkat</option><option value="sedang">Sedang</option></select></div>
        <div><label for="lang">Bahasa</label><select id="lang"><option value="id">Indonesia</option><option value="en">English</option><option value="mix">Campur</option></select></div>
      </div>
      <label for="rate">Kecepatan bicara: <span id="rv"></span></label><input type="range" id="rate" min="0.7" max="1.5" step="0.05">
      <label for="custom">Tambahan kepribadian (opsional)</label>
      <textarea id="custom" rows="2" placeholder="Contoh: kamu suka kopi dan sering menyebut hujan"></textarea>
      <div class="row"><button class="sm" id="reset">Atur ulang suara</button></div>
    </section>

    <section class="box">
      <h2>Transkrip</h2>
      <div class="log" id="log"><div class="sub">Belum ada percakapan.</div></div>
      <div class="row"><button class="sm" id="dl">Unduh transkrip</button></div>
    </section>
  </div>
</div>

<script>
(()=>{
const $=i=>document.getElementById(i);
const CH=[
 {id:"mimi",n:"Mimi",g:"f",e:"👧",h:330,v:"marin",rt:1.05,b:"Teman akrab yang ceria",s:"a cheerful, bright young Indonesian woman, playful and quick-witted, smiling as she speaks, laughs easily",d:"Kamu teman akrab yang ceria, hangat, dan suka bercanda.",hi:"Halo! Aku Mimi. Lagi ngapain nih?"},
 {id:"sari",n:"Sari",g:"f",e:"🌸",h:150,v:"sage",rt:0.95,b:"Kakak lembut, pendengar baik",s:"a gentle, warm older-sister voice, soft, calm and caring, slightly slower",d:"Kamu kakak perempuan yang lembut, sabar, pandai mendengarkan dan memberi semangat.",hi:"Halo, ini Sari. Gimana harimu?"},
 {id:"luna",n:"Luna",g:"f",e:"🔮",h:270,v:"shimmer",rt:1.0,b:"Guru cerdas yang jelas menjelaskan",s:"a clear, confident, intelligent woman, articulate like a favorite teacher",d:"Kamu guru perempuan yang cerdas, menjelaskan dengan contoh sederhana, dan penuh rasa ingin tahu.",hi:"Hai, aku Luna. Mau belajar atau ngobrol apa hari ini?"},
 {id:"kirana",n:"Kirana",g:"f",e:"💃",h:20,v:"coral",rt:1.1,b:"Bestie gaul yang ceplas-ceplos",s:"an energetic Jakarta best friend, fast, expressive, slangy, laughs easily",d:"Kamu bestie perempuan yang gaul, ekspresif, ceplas-ceplos tapi baik hati.",hi:"Haii, Kirana di sini! Cerita dong!"},
 {id:"raka",n:"Raka",g:"m",e:"😎",h:210,v:"ash",rt:1.0,b:"Cowok santai yang humoris",s:"a relaxed young Indonesian man, easygoing and casual, with a bit of dry humor",d:"Kamu cowok yang santai, humoris, dan enak diajak ngobrol soal apa saja.",hi:"Yo, aku Raka. Ada apa nih?"},
 {id:"bima",n:"Bima",g:"m",e:"🧔",h:35,v:"cedar",rt:0.92,b:"Mentor bijak bersuara berat",s:"a deep, calm, wise middle-aged man, slow and deliberate, with warm gravitas",d:"Kamu mentor laki-laki yang tenang, bijak, dan memberi nasihat dengan perumpamaan sederhana.",hi:"Selamat datang. Saya Bima. Silakan, apa yang ingin dibicarakan?"},
 {id:"dion",n:"Dion",g:"m",e:"🤡",h:55,v:"verse",rt:1.1,b:"Pelawak dengan jokes receh",s:"a goofy comedian, lively, exaggerated timing, pausing before punchlines",d:"Kamu laki-laki pelawak yang suka jokes receh dan permainan kata, tapi tetap peduli pada lawan bicara.",hi:"Halo! Aku Dion. Awas ya, jokesku receh!"},
 {id:"arga",n:"Arga",g:"m",e:"🎓",h:185,v:"echo",rt:1.0,b:"Pelatih bahasa Inggris",s:"a patient, friendly English coach with clear pronunciation and an encouraging tone",d:"Kamu pelatih bahasa Inggris laki-laki yang sabar. Balas dengan English sederhana, lalu koreksi kesalahan lawan bicara dengan lembut.",hi:"Hi, I am Arga. Let us practice English together. How are you today?"}
];
const VO=[["marin","Marin (cewek)"],["coral","Coral (cewek)"],["shimmer","Shimmer (cewek)"],["sage","Sage (cewek)"],["cedar","Cedar (cowok)"],["ash","Ash (cowok)"],["verse","Verse (cowok)"],["echo","Echo (cowok)"],["ballad","Ballad (cowok)"],["alloy","Alloy (netral)"]];
let S={ch:"mimi",style:"santai",len:"singkat",lang:"id",voice:"auto",rate:null,custom:"",tab:"all"};
try{Object.assign(S,JSON.parse(localStorage.getItem("tai3")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("tai3",JSON.stringify(S))}catch(e){}};
const cur=()=>CH.find(c=>c.id===S.ch)||CH[0];
let calling=false,muted=false,pc=null,dc=null,ms=null,aud=null,tick=null,cb=null,pend={};

function status(s,k){$("st").textContent=s;$("av").className="av"+(k?" "+k:"")}
function bubble(r,t){const l=$("log");if(!l.querySelector(".m"))l.innerHTML="";const d=document.createElement("div");d.className="m "+r;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
const send=o=>{if(dc&&dc.readyState==="open")dc.send(JSON.stringify(o))};

function renderTabs(){
 $("tabs").innerHTML="";
 [["all","Semua"],["f","Cewek"],["m","Cowok"]].forEach(([k,t])=>{
  const b=document.createElement("button");b.className="tab"+(S.tab===k?" on":"");b.textContent=t;
  b.onclick=()=>{S.tab=k;save();renderTabs();renderChars()};$("tabs").appendChild(b)})
}
function renderChars(){
 $("chars").innerHTML="";
 CH.filter(c=>S.tab==="all"||c.g===S.tab).forEach(c=>{
  const b=document.createElement("button");b.className="c"+(c.id===S.ch?" on":"");b.style.setProperty("--ch",c.h);
  b.innerHTML='<div class="e">'+c.e+'</div><b>'+c.n+'</b><span>'+c.b+'</span>';
  b.onclick=()=>{S.ch=c.id;S.rate=null;S.voice="auto";save();applyChar();renderChars();restart()};
  $("chars").appendChild(b)})
}
function applyChar(){
 const c=cur();document.documentElement.style.setProperty("--h",c.h);
 $("av").textContent=c.e;$("nm").textContent=c.n;$("bl").textContent=c.b;
 $("rate").value=S.rate??c.rt;sync();$("voice").value=S.voice;
}
function sync(){$("rv").textContent=(+$("rate").value).toFixed(2)+"x"}

function sys(){
 const c=cur(),st={santai:"santai dan natural",formal:"sopan dan formal",gaul:"gaul ala anak muda (sih, dong, banget)",lucu:"jenaka dan sering bercanda ringan"}[S.style];
 const lg={id:"bahasa Indonesia dengan aksen Indonesia yang natural",en:"English",mix:"campuran Indonesia dan Inggris secara natural"}[S.lang];
 return "Kamu bernama "+c.n+", seorang "+(c.g==="f"?"perempuan":"laki-laki")+". "+c.d+"\nSuara dan cara bicara: "+c.s+".\nGaya bicara: "+st+". Bahasa: "+lg+".\nIni telepon suara. Jawab "+(S.len==="singkat"?"1-2 kalimat pendek":"2-4 kalimat")+", seperti orang mengobrol: ada jeda, kata isian alami (hmm, eh, wah), tawa kecil bila pas, jangan terdengar membaca naskah. Jangan memakai daftar atau emoji. Jika pengguna menyela, berhenti dan tanggapi apa yang ia katakan. Sesekali ajukan satu pertanyaan balik. "+S.custom;
}
const push=()=>send({type:"session.update",session:{type:"realtime",instructions:sys(),audio:{output:{speed:+$("rate").value}}}});

function onEv(e){
 const t=e.type;
 if(t==="input_audio_buffer.speech_started"){status("Mendengarkan...","listen");pend[e.item_id]=bubble("u","…")}
 else if(t==="conversation.item.input_audio_transcription.completed"){const b=pend[e.item_id];if(b){b.textContent=(e.transcript||"").trim()||"(tidak terdengar)";delete pend[e.item_id]}}
 else if(t==="response.created"){cb=bubble("a","")}
 else if(/^response\.(output_)?audio_transcript\.delta$/.test(t)){if(cb){cb.textContent+=e.delta;$("log").scrollTop=1e9}}
 else if(/^response\.(output_)?audio_transcript\.done$/.test(t)){if(cb&&e.transcript)cb.textContent=e.transcript}
 else if(t==="response.done"){if(cb&&!cb.textContent)cb.remove();cb=null}
 else if(t==="output_audio_buffer.started")status(cur().n+" sedang bicara...","talk");
 else if(/^output_audio_buffer\.(stopped|cleared)$/.test(t))status("Mendengarkan...","listen");
 else if(t==="error")$("warn").textContent="Error: "+((e.error&&e.error.message)||"tidak diketahui");
}

function cleanup(){
 clearInterval(tick);try{dc&&dc.close()}catch(x){}try{pc&&pc.close()}catch(x){}
 if(ms)ms.getTracks().forEach(t=>t.stop());if(aud){aud.srcObject=null}
 pc=dc=ms=aud=cb=null;pend={};calling=false;
}
async function start(){
 $("warn").textContent="";$("call").disabled=true;status("Menyambungkan...");
 try{
  const sr=await fetch("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({instructions:sys(),voice:S.voice==="auto"?cur().v:S.voice,lang:S.lang,speed:+$("rate").value})});
  const sj=await sr.json();if(!sr.ok)throw new Error(sj.error||sr.status);
  ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  pc=new RTCPeerConnection();aud=new Audio();aud.autoplay=true;pc.ontrack=e=>{aud.srcObject=e.streams[0]};
  pc.addTrack(ms.getAudioTracks()[0],ms);
  dc=pc.createDataChannel("oai-events");dc.onmessage=ev=>{try{onEv(JSON.parse(ev.data))}catch(x){}};
  dc.onopen=()=>send({type:"response.create",response:{instructions:"Sapa pengguna dengan singkat dan natural, kira-kira seperti: "+cur().hi}});
  pc.onconnectionstatechange=()=>{if(calling&&/failed|closed/.test(pc.connectionState)){$("warn").textContent="Koneksi terputus.";end()}};
  await pc.setLocalDescription(await pc.createOffer());
  const ar=await fetch("https://api.openai.com/v1/realtime/calls",{method:"POST",body:pc.localDescription.sdp,headers:{Authorization:"Bearer "+sj.token,"Content-Type":"application/sdp"}});
  if(!ar.ok)throw new Error("Gagal tersambung ("+ar.status+")");
  await pc.setRemoteDescription({type:"answer",sdp:await ar.text()});
  calling=true;muted=false;$("mute").classList.remove("on");$("log").innerHTML="";
  $("call").className="b end";$("call").textContent="📵";status("Tersambung","listen");
  const t0=Date.now();tick=setInterval(()=>{const s=(Date.now()-t0)/1000|0;$("tm").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},500);
 }catch(e){$("warn").textContent="Error: "+e.message;cleanup();status("Siap menelepon")}
 $("call").disabled=false;
}
function end(){cleanup();$("call").className="b go";$("call").textContent="📞";status("Telepon berakhir")}
function restart(){if(calling){end();setTimeout(start,400)}}

$("call").onclick=()=>calling?end():start();
$("mute").onclick=function(){if(!ms)return;muted=!muted;ms.getAudioTracks()[0].enabled=!muted;this.classList.toggle("on",muted);status(muted?"Mikrofon dibisukan":"Mendengarkan...",muted?"":"listen")};
$("stop").onclick=()=>{send({type:"response.cancel"});send({type:"output_audio_buffer.clear"})};
const typed=()=>{const t=$("txt").value.trim();if(!t||!calling)return;$("txt").value="";bubble("u",t);
 send({type:"conversation.item.create",item:{type:"message",role:"user",content:[{type:"input_text",text:t}]}});send({type:"response.create"})};
$("send").onclick=typed;$("txt").onkeydown=e=>{if(e.key==="Enter")typed()};
["style","len","lang"].forEach(k=>{$(k).value=S[k];$(k).onchange=()=>{S[k]=$(k).value;save();push()}});
$("voice").innerHTML='<option value="auto">Otomatis (sesuai karakter)</option>'+VO.map(v=>'<option value="'+v[0]+'">'+v[1]+'</option>').join("");
$("custom").value=S.custom;$("custom").onchange=()=>{S.custom=$("custom").value;save();push()};
$("voice").onchange=()=>{S.voice=$("voice").value;save();restart()};
$("rate").oninput=()=>{S.rate=+$("rate").value;sync();save()};$("rate").onchange=push;
$("reset").onclick=()=>{S.rate=null;S.voice="auto";save();applyChar();restart()};
$("dl").onclick=()=>{
 const t=[].map.call($("log").querySelectorAll(".m"),m=>(m.classList.contains("u")?"Saya: ":cur().n+": ")+m.textContent).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t||"Belum ada percakapan."],{type:"text/plain"}));a.download="transkrip.txt";a.click();
};
if(!navigator.mediaDevices||!window.RTCPeerConnection)$("warn").textContent="Browser ini tidak mendukung panggilan suara. Gunakan Chrome, Edge, atau Safari terbaru.";
renderTabs();renderChars();applyChar();
})();
</script>
</body>
</html>
