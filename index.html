<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telepon AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📞%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#16182b;--mut:#6b7090;--line:#dde0ee;--ok:#16a34a;--bad:#e11d48;--h:250;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#181b30;--ink:#eceefb;--mut:#9aa0c4;--line:#2a2e4d;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 ui-rounded,"Nunito",system-ui,sans-serif}
.app{max-width:960px;margin:auto;padding:16px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.app{grid-template-columns:380px 1fr;align-items:start}.call{position:sticky;top:16px}}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.call{text-align:center;padding:24px 16px}
.av{width:120px;height:120px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:58px;background:linear-gradient(145deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 40) 75% 48%))}
.av.talk{animation:p 1s infinite}.av.listen{box-shadow:0 0 0 9px hsl(142 70% 45%/.3)}
@keyframes p{50%{transform:scale(1.06);box-shadow:0 0 0 18px hsl(var(--h) 80% 60%/0)}}
@media(prefers-reduced-motion:reduce){.av.talk{animation:none}}
h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:15px}
.sub{color:var(--mut);font-size:13px}.st{min-height:22px;margin-top:6px;color:var(--mut)}
.live{min-height:42px;margin-top:8px;font-style:italic;color:var(--mut);font-size:14px}
.bt{display:flex;justify-content:center;gap:16px;margin-top:14px}
.b{width:62px;height:62px;border:0;border-radius:50%;font-size:25px;cursor:pointer;background:var(--line);color:var(--ink)}
.b.go{background:var(--ok);color:#fff}.b.end{background:var(--bad);color:#fff}.b.on{background:hsl(var(--h) 75% 55%);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid hsl(var(--h) 85% 60%);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab,.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px}
.tab.on,.chip.on{background:hsl(var(--h) 75% 55%);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:12px;text-align:left;cursor:pointer;font:inherit}
.c.on{border-color:hsl(var(--ch) 75% 55%);background:hsl(var(--ch) 80% 55%/.12)}
.c .e{font-size:30px}.c b{display:block}.c span{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
select,input[type=text],textarea{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:hsl(var(--h) 75% 55%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.sm{padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{padding:8px 12px;border-radius:16px;max-width:88%;font-size:14px}
.m.u{align-self:flex-end;background:hsl(var(--h) 75% 55%);color:#fff}.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.col{display:grid;gap:14px}
</style>
</head>
<body>
<div class="app">
  <section class="box call">
    <div class="av" id="av">🙂</div>
    <h1 id="nm"></h1><div class="sub" id="bl"></div>
    <div class="st" id="st">Siap menelepon</div><div class="sub" id="tm">00:00</div>
    <div class="live" id="live"></div>
    <div class="bt">
      <button class="b" id="mute" title="Bisukan mikrofon" aria-label="Bisukan mikrofon">🎙️</button>
      <button class="b go" id="call" title="Telepon" aria-label="Telepon">📞</button>
      <button class="b" id="stop" title="Hentikan suara AI" aria-label="Hentikan suara AI">⏹️</button>
    </div>
    <div class="row"><input type="text" id="txt" placeholder="Atau ketik pesan..."><button class="sm" id="send" style="flex:0 0 72px">Kirim</button></div>
    <div class="sub" id="warn" style="margin-top:10px"></div>
  </section>

  <div class="col">
    <section class="box">
      <h2>Pilih karakter</h2>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="chars"></div>
    </section>

    <section class="box">
      <h2>Suara dan cara bicara</h2>
      <div class="two">
        <div><label for="style">Gaya bicara</label><select id="style">
          <option value="santai">Santai</option><option value="formal">Formal</option><option value="gaul">Gaul</option><option value="lucu">Lucu</option></select></div>
        <div><label for="len">Panjang jawaban</label><select id="len"><option value="singkat">Singkat</option><option value="sedang">Sedang</option></select></div>
        <div><label for="lang">Bahasa</label><select id="lang"><option value="id">Indonesia</option><option value="en">English</option><option value="mix">Campur</option></select></div>
        <div><label for="voice">Suara perangkat</label><select id="voice"></select></div>
      </div>
      <label for="pitch">Nada: <span id="pv"></span></label><input type="range" id="pitch" min="0.2" max="2" step="0.05">
      <label for="rate">Kecepatan: <span id="rv"></span></label><input type="range" id="rate" min="0.5" max="1.8" step="0.05">
      <label for="custom">Tambahan kepribadian (opsional)</label>
      <textarea id="custom" rows="2" placeholder="Contoh: kamu suka kopi dan sering menyebut hujan"></textarea>
      <div class="row"><button class="sm" id="test">🔊 Coba suara</button><button class="sm" id="reset">Atur ulang suara</button></div>
    </section>

    <section class="box">
      <h2>Transkrip</h2>
      <div class="log" id="log"><div class="sub">Belum ada percakapan.</div></div>
      <div class="row"><button class="sm" id="dl">Unduh transkrip</button></div>
    </section>
  </div>
</div>

<script>
(()=>{
const $=i=>document.getElementById(i);
const CH=[
 {id:"mimi",n:"Mimi",g:"f",e:"👧",h:330,pt:1.3,rt:1.1,b:"Teman akrab yang ceria",d:"Kamu teman akrab yang ceria, hangat, dan suka bercanda.",hi:"Halo! Aku Mimi. Lagi ngapain nih?"},
 {id:"sari",n:"Sari",g:"f",e:"🌸",h:150,pt:1.05,rt:0.9,b:"Kakak yang lembut dan pendengar baik",d:"Kamu kakak perempuan yang lembut, sabar, dan pandai mendengarkan serta memberi semangat.",hi:"Halo, ini Sari. Gimana harimu?"},
 {id:"luna",n:"Luna",g:"f",e:"🔮",h:270,pt:1.1,rt:1.0,b:"Guru cerdas yang jelas menjelaskan",d:"Kamu guru perempuan yang cerdas, suka menjelaskan dengan contoh sederhana, dan penuh rasa ingin tahu.",hi:"Hai, aku Luna. Mau belajar atau ngobrol apa hari ini?"},
 {id:"kirana",n:"Kirana",g:"f",e:"💃",h:20,pt:1.2,rt:1.2,b:"Bestie gaul yang ceplas-ceplos",d:"Kamu bestie perempuan yang gaul, ekspresif, dan ceplas-ceplos tapi tetap baik hati.",hi:"Haii, Kirana di sini! Cerita dong!"},
 {id:"raka",n:"Raka",g:"m",e:"😎",h:210,pt:0.85,rt:1.0,b:"Cowok santai yang humoris",d:"Kamu cowok yang santai, humoris, dan enak diajak ngobrol soal apa saja.",hi:"Yo, aku Raka. Ada apa nih?"},
 {id:"bima",n:"Bima",g:"m",e:"🧔",h:35,pt:0.55,rt:0.85,b:"Mentor bijak bersuara berat",d:"Kamu mentor laki-laki yang tenang, bijak, dan memberi nasihat dengan perumpamaan sederhana.",hi:"Selamat datang. Saya Bima. Silakan, apa yang ingin dibicarakan?"},
 {id:"dion",n:"Dion",g:"m",e:"🤡",h:55,pt:1.0,rt:1.25,b:"Pelawak dengan jokes receh",d:"Kamu laki-laki pelawak yang suka melempar jokes receh dan permainan kata, tapi tetap peduli pada lawan bicara.",hi:"Halo! Aku Dion. Awas ya, jokesku receh!"},
 {id:"arga",n:"Arga",g:"m",e:"🎓",h:185,pt:0.8,rt:1.0,b:"Pelatih bahasa Inggris",d:"Kamu pelatih bahasa Inggris laki-laki yang sabar. Balas dengan English sederhana, lalu koreksi kesalahan lawan bicara dengan lembut.",hi:"Hi, I am Arga. Let us practice English together. How are you today?"}
];
let S={ch:"mimi",style:"santai",len:"singkat",lang:"id",voice:"auto",pitch:null,rate:null,custom:"",tab:"all"};
try{Object.assign(S,JSON.parse(localStorage.getItem("tai")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("tai",JSON.stringify(S))}catch(e){}};
const cur=()=>CH.find(c=>c.id===S.ch)||CH[0];
const synth=window.speechSynthesis,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let voices=[],calling=false,busy=false,speaking=false,muted=false,hist=[],rec=null,token=0,t0=0,tick=null;

function status(s,k){$("st").textContent=s;$("av").className="av"+(k?" "+k:"")}
function log(r,t){const l=$("log");if(!l.querySelector(".m"))l.innerHTML="";const d=document.createElement("div");d.className="m "+r;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight}

function renderTabs(){
 $("tabs").innerHTML="";
 [["all","Semua"],["f","Cewek"],["m","Cowok"]].forEach(([k,t])=>{
  const b=document.createElement("button");b.className="tab"+(S.tab===k?" on":"");b.textContent=t;
  b.onclick=()=>{S.tab=k;save();renderTabs();renderChars()};$("tabs").appendChild(b)})
}
function renderChars(){
 $("chars").innerHTML="";
 CH.filter(c=>S.tab==="all"||c.g===S.tab).forEach(c=>{
  const b=document.createElement("button");b.className="c"+(c.id===S.ch?" on":"");b.style.setProperty("--ch",c.h);
  b.innerHTML='<div class="e">'+c.e+'</div><b>'+c.n+'</b><span>'+c.b+'</span>';
  b.onclick=()=>{S.ch=c.id;S.pitch=null;S.rate=null;S.voice="auto";save();applyChar();renderChars();say(c.hi,true)};
  $("chars").appendChild(b)})
}
function applyChar(){
 const c=cur();document.documentElement.style.setProperty("--h",c.h);
 $("av").textContent=c.e;$("nm").textContent=c.n;$("bl").textContent=c.b;
 $("pitch").value=S.pitch??c.pt;$("rate").value=S.rate??c.rt;sync();
 if(voices.length)$("voice").value=S.voice;
}
function sync(){$("pv").textContent=(+$("pitch").value).toFixed(2);$("rv").textContent=(+$("rate").value).toFixed(2)}

function loadVoices(){
 if(!synth)return;voices=synth.getVoices();
 const v=$("voice");v.innerHTML='<option value="auto">Otomatis (sesuai karakter)</option>';
 voices.slice().sort((a,b)=>(/^id/i.test(a.lang)?0:1)-(/^id/i.test(b.lang)?0:1)||a.name.localeCompare(b.name))
  .forEach(x=>{const o=document.createElement("option");o.value=x.name;o.textContent=x.name+" ("+x.lang+")";v.appendChild(o)});
 v.value=S.voice;if(v.value!==S.voice)v.value="auto";
}
function autoVoice(c){
 const L=S.lang==="en"?"en":"id";
 let vs=voices.filter(v=>v.lang.toLowerCase().startsWith(L));
 if(!vs.length)vs=voices.filter(v=>/^(id|en)/i.test(v.lang));if(!vs.length)vs=voices;
 const F=/female|wanita|perempuan|gadis|zira|samantha|siti|google/i,M=/male|pria|andika|david|mark|daniel|guy|alex|fred/i;
 let g=vs.filter(v=>c.g==="f"?F.test(v.name):(M.test(v.name)&&!/female/i.test(v.name)));
 if(!g.length)g=vs;
 return g[CH.filter(x=>x.g===c.g).indexOf(c)%g.length];
}
const getVoice=()=>S.voice!=="auto"?voices.find(v=>v.name===S.voice):autoVoice(cur());

async function say(text){
 if(!synth)return;
 synth.cancel();const my=++token;speaking=true;
 const parts=text.match(/[^.!?\n]+[.!?]*/g)||[text];
 for(const p of parts){
  if(my!==token)break;if(!p.trim())continue;
  await new Promise(r=>{
   const u=new SpeechSynthesisUtterance(p.trim()),v=getVoice();
   if(v){u.voice=v;u.lang=v.lang}else u.lang=S.lang==="en"?"en-US":"id-ID";
   u.pitch=+$("pitch").value;u.rate=+$("rate").value;u.onend=u.onerror=r;synth.speak(u)})
 }
 if(my===token)speaking=false;
}
function stopSpeech(){token++;if(synth)synth.cancel();speaking=false}

function sys(){
 const c=cur(),st={santai:"santai dan natural",formal:"sopan dan formal",gaul:"gaul ala anak muda (sih, dong, banget)",lucu:"jenaka dan sering bercanda ringan"}[S.style];
 const lg={id:"bahasa Indonesia",en:"English",mix:"campuran Indonesia dan Inggris"}[S.lang];
 return "Kamu bernama "+c.n+", seorang "+(c.g==="f"?"perempuan":"laki-laki")+". "+c.d+" Gaya bicara: "+st+". Bahasa: "+lg+". Ini telepon suara: jawab dalam "+(S.len==="singkat"?"1-2 kalimat pendek":"2-4 kalimat")+", tanpa emoji, tanpa markdown atau daftar, seperti orang bicara lisan. Sesekali ajukan satu pertanyaan balik. "+S.custom;
}

async function ask(t){
 busy=true;hist.push({role:"user",content:t});log("u",t);status(cur().n+" sedang berpikir...");
 let reply=null;
 try{
  const m=hist.slice(-20);while(m.length&&m[0].role!=="user")m.shift();
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:sys(),messages:m})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);reply=d.reply;
 }catch(e){$("warn").textContent="Error: "+e.message;hist.pop()}
 if(!calling){busy=false;return}
 $("live").textContent="";
 if(reply){hist.push({role:"assistant",content:reply});log("a",reply);status(cur().n+" sedang bicara...","talk");await say(reply)}
 else await say("Maaf, sambungannya bermasalah. Coba ulangi ya.");
 busy=false;if(calling)listen();
}

function listen(){
 if(!calling||busy||speaking||muted||!SR)return;
 try{rec&&rec.abort()}catch(e){}
 const r=rec=new SR();r.lang=S.lang==="en"?"en-US":"id-ID";r.interimResults=true;r.continuous=false;let fin="";
 r.onstart=()=>status("Mendengarkan...","listen");
 r.onresult=ev=>{let i="";for(let k=ev.resultIndex;k<ev.results.length;k++){const x=ev.results[k];if(x.isFinal)fin+=x[0].transcript;else i+=x[0].transcript}$("live").textContent=fin+i};
 r.onerror=e=>{if(/not-allowed|service-not-allowed/.test(e.error)){rec=null;status("Izin mikrofon ditolak. Ketik pesanmu.")}};
 r.onend=()=>{if(!calling||rec!==r)return;if(fin.trim())ask(fin.trim());else setTimeout(listen,300)};
 try{r.start()}catch(e){setTimeout(listen,500)}
}

async function start(){
 calling=true;hist=[];busy=true;muted=false;$("mute").classList.remove("on");$("log").innerHTML="";$("warn").textContent="";
 $("call").className="b end";$("call").textContent="📵";
 t0=Date.now();clearInterval(tick);tick=setInterval(()=>{const s=(Date.now()-t0)/1000|0;$("tm").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},500);
 const hi=cur().hi;hist.push({role:"user",content:"(Telepon tersambung. Sapa aku.)"},{role:"assistant",content:hi});
 status("Tersambung","talk");log("a",hi);await say(hi);busy=false;listen();
}
function end(){
 calling=false;busy=false;stopSpeech();try{rec&&rec.abort()}catch(e){}rec=null;clearInterval(tick);
 $("call").className="b go";$("call").textContent="📞";$("live").textContent="";status("Telepon berakhir");
}

$("call").onclick=()=>calling?end():start();
$("mute").onclick=function(){muted=!muted;this.classList.toggle("on",muted);if(muted){try{rec&&rec.abort()}catch(e){}rec=null;status("Mikrofon dibisukan")}else listen()};
$("stop").onclick=stopSpeech;
const typed=()=>{const t=$("txt").value.trim();if(!t||!calling||busy)return;$("txt").value="";stopSpeech();try{rec&&rec.abort()}catch(e){}ask(t)};
$("send").onclick=typed;$("txt").onkeydown=e=>{if(e.key==="Enter")typed()};
["style","len","lang"].forEach(k=>{$(k).value=S[k];$(k).onchange=()=>{S[k]=$(k).value;save()}});
$("custom").value=S.custom;$("custom").oninput=()=>{S.custom=$("custom").value;save()};
$("voice").onchange=()=>{S.voice=$("voice").value;save()};
$("pitch").oninput=()=>{S.pitch=+$("pitch").value;sync();save()};
$("rate").oninput=()=>{S.rate=+$("rate").value;sync();save()};
$("test").onclick=()=>say("Halo, begini suaraku dengan pengaturan ini.");
$("reset").onclick=()=>{S.pitch=S.rate=null;S.voice="auto";save();applyChar()};
$("dl").onclick=()=>{
 const t=hist.filter(m=>m.content.charAt(0)!=="(").map(m=>(m.role==="user"?"Saya: ":cur().n+": ")+m.content).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t||"Belum ada percakapan."],{type:"text/plain"}));a.download="transkrip.txt";a.click();
};

if(synth){loadVoices();synth.onvoiceschanged=()=>{loadVoices();applyChar()}}
const w=[];if(!synth)w.push("Perangkat ini tidak mendukung suara AI.");
if(!SR)w.push("Browser ini tidak mendukung pengenalan suara. Pakai Chrome atau Edge, atau ketik pesan.");
$("warn").textContent=w.join(" ");
renderTabs();renderChars();applyChar();
})();
</script>
</body>
</html>
